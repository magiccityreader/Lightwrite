name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Go tests
        working-directory: go
        run: go test ./...
      - name: Build
        working-directory: go
        run: go build -o ../dist/lightwrite ./cmd/lightwrite

  python-legacy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tools
        run: python -m pip install --upgrade pip pyflakes pyte
      - name: Lint
        working-directory: legacy/python
        run: python -m pyflakes src tests
      - name: Unit tests
        working-directory: legacy/python
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Import smoke
        working-directory: legacy/python
        run: PYTHONPATH=src python -c "import lightwrite.app"
      - name: Editor smoke (pty)
        working-directory: legacy/python
        run: python tests/smoke_pty.py
        timeout-minutes: 5

  deb:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [go-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build .deb
        run: bash scripts/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lightwrite-deb
          path: dist/*.deb
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
          gh release upload "$GITHUB_REF_NAME" dist/*.deb --clobber
